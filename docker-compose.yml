# Scarecrow drone — full product (webapp + simulation).
#
#   docker compose up
#   -> http://localhost:8000/
#
# That URL is the whole interface. Pick the world, camera and drone spawn in
# the UI, press Connect to launch PX4 + Gazebo, then fly. Nothing else to run
# and no shell in the container: the sim is the product, the UI is how it is
# used, and the UI is the only way in.
#
# The camera feed is served on :8080 and embedded by the UI, so that port has
# to be published too — but nobody needs to open it directly.
#
# Available worlds: hangar, hangar_detailed, hangar_lite, hangar_small
# Available cameras: fixed, drone_cam, drone_view
#
# WORLD/CAMERA below are only defaults for the UI's initial selection, and the
# fixed choice in sim mode (SCARECROW_MODE=sim), which runs the sim headless
# with no webapp — for CI and for debugging a launch in isolation.

services:
  sim:
    # For delivery this resolves to a prebuilt image and nothing compiles on the
    # customer's machine. `docker compose build` is only for maintainers who are
    # deliberately bumping a pin in docker/versions.env.
    image: ${SCARECROW_IMAGE:-scarecrow-sim:dev}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Empty defaults so a customer running `docker compose up` against the
        # prebuilt image is not greeted by "variable is not set" warnings about
        # build args that are never used. Maintainers must build via
        # `bash docker/build.sh`, which sources docker/versions.env and fails
        # loudly if a pin is missing.
        UBUNTU_DIGEST: ${UBUNTU_DIGEST:-}
        GZ_VERSION: ${GZ_VERSION:-}

    ports:
      # The webapp — this is the URL the user opens.
      - "${WEBAPP_PORT:-8000}:8000"
      # Camera stream, embedded by the UI.
      - "${STREAM_PORT:-8080}:8080"
      # PX4 MAVLink API. Published so flight scripts can optionally be run from
      # the host against the container's PX4, in addition to running inside it.
      - "14540:14540/udp"
      # MAVLink GCS (QGroundControl).
      - "14550:14550/udp"

    environment:
      # webapp (default) serves the UI and waits for Connect.
      # sim launches the simulation headless with no UI — CI and debugging.
      SCARECROW_MODE: ${SCARECROW_MODE:-webapp}

      WORLD: ${WORLD:-hangar_small}
      CAMERA: ${CAMERA:-fixed}
      STREAM_PORT: "8080"
      WEBAPP_PORT: "8000"

      # MJPEG, not WebRTC. WebRTC's ICE media path cannot cross Docker port
      # mapping (signalling connects, video stays black). See docker/Dockerfile.
      STREAM_MODE: ${STREAM_MODE:-mjpeg}

      # Set to 1 on hardware that must not fall back to software rendering
      # (the ROG Strix delivery machines). All 5 sensors are GPU-rendered:
      # 3 cameras + 2 gpu_lidar. A silent llvmpipe fallback still "works",
      # just too slowly to fly a complex world.
      REQUIRE_GPU: ${REQUIRE_GPU:-0}

      # Set to 1 to skip the ~20s Gazebo preflight once the image is trusted.
      SKIP_PREFLIGHT: ${SKIP_PREFLIGHT:-0}

      # Default ON in containers. PX4 lockstep makes PX4 wait for each Gazebo
      # render step; without a GPU that wait dominates (measured RTF 0.055 on
      # Apple Silicon). Nolockstep runs PX4 on wall-clock instead.
      # Set to 0 on GPU machines that can afford full lockstep fidelity.
      SCARECROW_NOLOCKSTEP: ${SCARECROW_NOLOCKSTEP:-1}

    # Gazebo + PX4 need a moment to shut down cleanly.
    stop_grace_period: 15s

    # The UI is not reachable immediately: the entrypoint first checks the
    # renderer and runs a ~20s Gazebo preflight. Without a healthcheck that
    # looks like a hang, and the user opens the URL too early and sees a
    # connection refused. `docker compose ps` shows healthy when it is ready.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

# =====================================================================
# GPU profiles
# =====================================================================
# Three, because the delivery machines and the machine a future student
# inherits this on are not the same hardware. All of them set REQUIRE_GPU=1,
# so a profile that does not actually reach the GPU fails loudly at startup
# instead of quietly rendering every camera and lidar on the CPU.
#
#   --profile gpu       NVIDIA, Windows/WSL2 or Linux (the delivery laptops)
#   --profile gpu-wsl   ANY GPU on Windows via WSL2 — AMD, Intel or NVIDIA
#   --profile gpu-dri   AMD or Intel on native Linux
#
# The image already carries the Mesa drivers these need: d3d12 (WSL2, any
# vendor), radeonsi (AMD), iris (Intel), zink (Vulkan fallback). Only the
# device passthrough differs.
#
# ---------------------------------------------------------------------
# NVIDIA. Requires nvidia-container-toolkit on the host.
#   docker compose --profile gpu up
# ---------------------------------------------------------------------
  sim-gpu:
    profiles: ["gpu"]
    extends:
      service: sim
    environment:
      # Software rendering becomes fatal instead of a silent slow fallback.
      REQUIRE_GPU: "1"

      # Lockstep ON, unlike the CPU default. Nolockstep exists to stop PX4
      # waiting on a slow software renderer; with a real GPU that wait is
      # cheap, and lockstep is PX4's intended mode -- deterministic sensor
      # timing, and the same behaviour the sim was developed against natively
      # on macOS (RTF 0.87 with lockstep on). Set SCARECROW_NOLOCKSTEP=1 to
      # override if a machine turns out to need it.
      SCARECROW_NOLOCKSTEP: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

# ---------------------------------------------------------------------
# Any GPU on Windows via WSL2 — AMD, Intel, or NVIDIA.
#   docker compose --profile gpu-wsl up
# ---------------------------------------------------------------------
# WSL2 paravirtualises the GPU through /dev/dxg regardless of vendor, and Mesa
# talks to it with the d3d12 Gallium driver. This is the path for a student
# whose laptop is not NVIDIA — the nvidia profile above would do nothing for
# them, and the sim would silently run on llvmpipe.
#
# /usr/lib/wsl/lib holds the host-side driver shims (libd3d12core.so and
# friends) that WSL mounts into the distro; the container needs them on its
# library path or Mesa cannot load d3d12.
#
# Run Docker INSIDE the WSL2 distro for this. Docker Desktop's WSL2 backend
# only forwards NVIDIA devices, so /dev/dxg will not be there.
  sim-gpu-wsl:
    profiles: ["gpu-wsl"]
    extends:
      service: sim
    environment:
      REQUIRE_GPU: "1"
      SCARECROW_NOLOCKSTEP: "0"
      LD_LIBRARY_PATH: /usr/lib/wsl/lib
    devices:
      - /dev/dxg:/dev/dxg
    volumes:
      - /usr/lib/wsl:/usr/lib/wsl:ro

# ---------------------------------------------------------------------
# AMD or Intel on native Linux.
#   docker compose --profile gpu-dri up
# ---------------------------------------------------------------------
# Straight /dev/dri passthrough to Mesa (radeonsi for AMD, iris for Intel).
# No vendor toolkit needed. If the render node is missing, check the user is
# in the `render` and `video` groups on the host.
  sim-gpu-dri:
    profiles: ["gpu-dri"]
    extends:
      service: sim
    environment:
      REQUIRE_GPU: "1"
      SCARECROW_NOLOCKSTEP: "0"
    devices:
      - /dev/dri:/dev/dri
