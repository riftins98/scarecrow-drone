[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scarecrow"
version = "0.1.0"
description = "Scarecrow Drone — GPS-denied indoor navigation"
requires-python = ">=3.10"
dependencies = [
    "mavsdk",
    "numpy",
]

[project.optional-dependencies]
# Everything a simulated flight touches. torch/torchvision/ultralytics were
# missing here while being pinned in requirements.txt, so `pip install -e
# ".[sim]"` produced a package that imported fine and then failed mid-flight
# the first time YOLO was asked for a detection. aiohttp serves the MJPEG
# stream. Versions are pinned in requirements.txt, not here — see the module
# docstring of tests/unit/test_dependency_pins.py.
sim = [
    "opencv-python-headless",
    "matplotlib",
    "pillow",
    "aiohttp",
    "torch",
    "torchvision",
    "ultralytics",
]
hardware = ["rplidar-roboticia"]
webapp = [
    "fastapi==0.135.3",
    "uvicorn==0.44.0",
    "aiofiles==25.1.0",
    "pydantic>=2.0",
]
test = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
include = ["scarecrow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "webapp/backend"]
asyncio_mode = "auto"
